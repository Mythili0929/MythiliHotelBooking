<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update Passenger | BusBook</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html"><div class="brand-icon">🚌</div><div><h1>BusBook</h1><p>Online Bus Reservation System</p></div></a><span class="top-pill">🚌 Travel • Reserve • Go</span></header><nav class="nav"><a href="index.html">🏠 Dashboard</a><a href="insert.html">➕ Add Passenger</a><a href="list.html">📋 All Passengers</a><a href="listOne.html">🔎 Find Passenger</a><a href="update.html">✏️ Update</a><a href="delete.html">🗑️ Delete</a></nav><main class="container"><section class="page-heading"><div><p class="eyebrow">PASSENGER RECORDS / UPDATE</p><h2>✏️ Update Passenger</h2><p>Choose an ID, edit the details, and save your changes.</p></div></section><section class="card"><div class="form-grid"><div class="field"><label for="pid">Passenger ID</label><select id="pid" required><option value="">-- Select Passenger ID --</option></select></div></div><div id="notice" class="notice" role="status"></div><form id="f"><div class="form-grid"><div class="field"><label for="name">Name *</label><input id="name" required></div><div class="field"><label for="email">Email *</label><input id="email" type="email" required></div><div class="field"><label for="phone">Phone *</label><input id="phone" required></div><div class="field"><label for="password">New/Current Password *</label><input id="password" type="password" minlength="6" required></div></div><div class="button-row"><button class="btn btn-primary">💾 Update Passenger</button></div></form></section></main><footer class="footer">🚌 BusBook · Passenger records made simple</footer><script>const s=document.getElementById('pid'),f=document.getElementById('f'),n=document.getElementById('notice');fetch('/passengers').then(r=>r.json()).then(a=>a.forEach(p=>{let o=document.createElement('option');o.value=p.passenger_id;o.textContent=p.passenger_id;s.append(o)})).catch(()=>n.textContent='Could not load IDs.');s.addEventListener('change',async()=>{if(!s.value)return;let r=await fetch('/passengers/'+s.value),a=await r.json(),p=a[0];if(p){name.value=p.name;email.value=p.email;phone.value=p.phone;password.value='';n.textContent='Enter the password to save updates.'}});f.addEventListener('submit',async e=>{e.preventDefault();try{let r=await fetch('/passengers/'+s.value,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value.trim(),email:email.value.trim(),phone:phone.value.trim(),password:password.value})}),t=await r.text();if(!r.ok)throw Error(t);n.className='notice success';n.textContent='Passenger updated successfully.'}catch(e){n.className='notice error';n.textContent='Update failed: '+e.message}});</script></body></html>
