<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Audio</h1>
    <audio controls>
        <source src="sample_audio.mp3" type="audio/mpeg">
    </audio>
    <br>
    <h1>Video</h1>
    <video controls>
        <source src="sample_video.mp4" type="video.mp4">
    </video>
    <br>
    <h1>Autoplay Video</h1>
    <video autoplay muted width="300" height="300"controls>
        <source src="sample_video.mp4" type="video.mp4">
    </video>
    <br>
    <h1>Yt Video</h1>
    <iframe width="200" height="200"
    <source src="#"allowfullscreen>
    </iframe>
</body>
</html>
