<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Output Demo</h2>
    <p id="demo">paragraph</p>
    <script>
        alert("This is alert box output");
        console.log("This message appears in the browser console");
        document.write("<p>This output is written using document.write()</p>");
        document.getElementById("demo").innerHTML="This output is displayed using innerHTML";
        window.print();
    </script>
</body>
</html>
