<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM update</title>
    <script>
        function changeText(){
            document.getElementById("t").innerHTML = "Text has been changed!";
        }
    </script>
</head>
<body>
    <h2 id="t">Original Text</h2>
    <button onclick="changeText()">Change Text</button>

</body>
</html>
