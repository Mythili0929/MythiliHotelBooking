<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Example</title>
    <script>
        var student = {
            name : "shiva kumar",
            age : 19,
            course : "CSE",
            show:function(){
                document.write(this.name+" is "+this.age+" years old and is studying "+this.course+".");
            }
        };
        student.show();
    </script>
</head>
<body>
    <p id="result"></p>
</body>
</html>
