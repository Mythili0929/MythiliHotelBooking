<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Properties</title>
    <style>
        p{
            font-family: Arial;
            font-size: 20px;
            font-weight: bold;
            font-style: italic;
            font-variant: small-caps;
        }
    </style>
</head>
<body>
    <h2>Font Properties Example</h2>
    <p>
        This is an example of font properties in CSS.
    </p>    
</body>
</html>
