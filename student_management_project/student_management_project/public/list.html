<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>List Students</title></head>
<body>
<h1>LIST OF STUDENTS</h1><hr>
<a href="index.html">Home</a> |
<a href="list.html">List Students</a> |
<a href="listOne.html">List Required Student</a> |
<a href="insert.html">Insert Student</a> |
<a href="update.html">Update Student</a> |
<a href="delete.html">Delete Student</a>
<hr>
<button onclick="loadStudents()">Refresh List</button><br><br>
<table border="1" id="studentTable"></table><br>
<button onclick="location.href='index.html'">Home Page</button>
<script>
function loadStudents() {
    fetch("/students")
    .then(async response => {
        if (!response.ok) throw new Error(await response.text());
        return response.json();
    })
    .then(data => {
        const table = document.getElementById("studentTable");
        table.innerHTML = `<tr><th>Student Number</th><th>Name</th><th>Total</th></tr>`;
        data.forEach(student => {
            table.innerHTML += `<tr><td>${student.sno}</td><td>${student.Name}</td><td>${student.Total}</td></tr>`;
        });
    })
    .catch(error => alert("Could not load students: " + error.message));
}
loadStudents();
</script>
</body>
</html>
