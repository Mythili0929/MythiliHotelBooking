<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Insert Student</title></head>
<body>
<h1>INSERT STUDENT</h1><hr>
<a href="index.html">Home</a> |
<a href="list.html">List Students</a> |
<a href="listOne.html">List Required Student</a> |
<a href="insert.html">Insert Student</a> |
<a href="update.html">Update Student</a> |
<a href="delete.html">Delete Student</a>
<hr>
Student Number <input type="number" id="sno"><br><br>
Student Name <input type="text" id="name"><br><br>
Total Marks <input type="number" id="total"><br><br>
<button onclick="saveStudent()">Save</button><br><br>
<button onclick="location.href='index.html'">Home Page</button>
<script>
function saveStudent() {
    const sno = document.getElementById("sno").value;
    const name = document.getElementById("name").value.trim();
    const total = document.getElementById("total").value;
    if (sno === "" || name === "" || total === "") return alert("Please fill all fields");
    fetch("/students", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({sno: Number(sno), name: name, total: Number(total)})
    })
    .then(async response => {
        const message = await response.text();
        if (!response.ok) throw new Error(message);
        return message;
    })
    .then(message => { alert(message); location.href = "list.html"; })
    .catch(error => alert("Error: " + error.message));
}
</script>
</body>
</html>
