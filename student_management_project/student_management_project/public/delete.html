<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Delete Student</title></head>
<body>
<h1>DELETE STUDENT</h1><hr>
<a href="index.html">Home</a> |

<a href="delete.html">Delete Student</a>
<hr>
Student Number to Delete <input type="number" id="sno"><br><br>
<button onclick="deleteStudent()">Delete</button><br><br>
<button onclick="location.href='index.html'">Home Page</button>
<script>
function deleteStudent() {
    const sno = document.getElementById("sno").value;
    if (!sno) return alert("Please enter Student Number");
    if (!confirm("Are you sure you want to delete this student?")) return;
    fetch("/students/" + encodeURIComponent(sno), {method: "DELETE"})
    .then(async response => {
        const message = await response.text();
        if (!response.ok) throw new Error(message);
        return message;
    })
    .then(message => { alert(message); location.href = "list.html"; })
    .catch(error => alert("Error: " + error.message));
}
</script>
</body>
</html>
