<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Search Student</title></head>
<body>
<h1>SEARCH STUDENT</h1><hr>
<a href="index.html">Home</a> |
<a href="list.html">List Students</a> |
<a href="listOne.html">List Required Student</a> |
<a href="insert.html">Insert Student</a> |
<a href="update.html">Update Student</a> |
<a href="delete.html">Delete Student</a>
<hr>
Student Number <input type="number" id="sno">
<button onclick="searchStudent()">Search</button><br><br>
<table border="1" id="studentTable">
<tr><th>Student Number</th><th>Name</th><th>Total</th></tr>
</table><br>
<button onclick="location.href='index.html'">Home Page</button>
<script>
function searchStudent() {
    const sno = document.getElementById("sno").value;
    if (!sno) return alert("Please enter Student Number");
    fetch("/students/" + encodeURIComponent(sno))
    .then(async response => {
        if (!response.ok) throw new Error(await response.text());
        return response.json();
    })
    .then(data => {
        const table = document.getElementById("studentTable");
        table.innerHTML = `<tr><th>Student Number</th><th>Name</th><th>Total</th></tr>`;
        if (!data.length) return alert("Student Not Found");
        table.innerHTML += `<tr><td>${data[0].sno}</td><td>${data[0].Name}</td><td>${data[0].Total}</td></tr>`;
    })
    .catch(error => alert("Error: " + error.message));
}
</script>
</body>
</html>
